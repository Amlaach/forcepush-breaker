[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitghost"
version = "1.0.0"
description = "UnForce (ForcePush-Breaker) — Chromium Desktop & CLI Suite for Git Commit Recovery, Branch Restoration & Secret Forensics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "UnForce / GitGhost Security Team", email = "security@gitghost.io" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=4.0.0",
]
test = [
    "pytest>=7.0.0",
]
all = [
    "pywebview>=4.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
unforce = "gitghost.cli:app"
forcepush-breaker = "gitghost.cli:app"
gitghost = "gitghost.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitghost*"]

[tool.setuptools.package-data]
gitghost = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
