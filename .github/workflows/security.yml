name: UnForce Security & SARIF Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  forensics-scan:
    name: UnForce Forensics Scan & SARIF Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run UnForce Forensics Scan (Export SARIF 2.1.0)
        run: |
          python -m gitghost scan . --no-ai --format sarif --output unforce-scan.sarif

      - name: Upload SARIF to GitHub Security Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: unforce-scan.sarif
          category: unforce-forensics
