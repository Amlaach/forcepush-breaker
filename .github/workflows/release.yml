name: Release UnForce Desktop (Windows, macOS, Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.8.1)"
        required: false
        default: "v0.8.1"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pyinstaller_sep: ";"
            npm_script: "dist:win"
            artifact_glob: "desktop/dist/UnForce-*.exe"
          - os: macos-latest
            pyinstaller_sep: ":"
            npm_script: "dist:mac"
            artifact_glob: "desktop/dist/UnForce-macOS-*"
          - os: ubuntu-latest
            pyinstaller_sep: ":"
            npm_script: "dist:linux"
            artifact_glob: "desktop/dist/UnForce-Linux-*"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux FUSE / Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install Windows NSIS Build Dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nsis -y
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisPath) {
            echo $nsisPath >> $env:GITHUB_PATH
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller
          pip install -e .

      - name: Run Full Pytest Verification
        run: |
          pytest -q tests/

      - name: Generate App Icons & Pre-Rendered UI Bundle
        run: |
          python scripts/generate_icons.py
          python scripts/build_ui_bundle.py

      - name: Bundle Standalone Python Backend (unforce-engine)
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --noconsole \
            --name unforce-engine \
            --exclude-module PySide6 \
            --exclude-module shiboken6 \
            --exclude-module PyQt5 \
            --exclude-module PyQt6 \
            --exclude-module qtpy \
            --exclude-module webview \
            --exclude-module PIL \
            --exclude-module tkinter \
            --exclude-module _tkinter \
            --exclude-module cryptography \
            --exclude-module pytest \
            --exclude-module setuptools \
            --exclude-module pip \
            --exclude-module wheel \
            --exclude-module numpy \
            --exclude-module pandas \
            --exclude-module scipy \
            --exclude-module matplotlib \
            --exclude-module torch \
            --add-data "gitghost/static${{ matrix.pyinstaller_sep }}gitghost/static" \
            --distpath build_backend \
            --workpath build/pyinstaller_work \
            gitghost/__main__.py

      - name: Install Electron & Build Chromium Desktop Packages
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          node node_modules/electron/install.js || true
          npm run ${{ matrix.npm_script }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unforce-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 7

  publish-release:
    name: Publish Unified GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download All Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: unforce-*
          merge-multiple: true

      - name: Inspect & Compute Cryptographic SHA-256 Checksums
        run: |
          cd release_assets
          echo "=== Built Packages ==="
          ls -la
          sha256sum * > SHA256SUMS.txt
          echo "=== SHA-256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.tag_name != '' && inputs.tag_name || 'v0.8.1') }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
