name: Release UnForce Desktop (Windows, macOS, Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pyinstaller_sep: ";"
            npm_script: "dist:win"
            artifact_glob: "desktop/dist/UnForce-*.exe"
          - os: macos-latest
            pyinstaller_sep: ":"
            npm_script: "dist:mac"
            artifact_glob: "desktop/dist/UnForce-macOS-*"
          - os: ubuntu-latest
            pyinstaller_sep: ":"
            npm_script: "dist:linux"
            artifact_glob: "desktop/dist/UnForce-Linux-*"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller
          pip install -e .

      - name: Run Full Pytest Verification
        run: |
          pytest -q tests/

      - name: Generate App Icons & Pre-Rendered UI Bundle
        run: |
          python scripts/generate_icons.py
          python scripts/build_ui_bundle.py

      - name: Bundle Standalone Python Backend (unforce-engine)
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name unforce-engine --exclude-module PySide6 --exclude-module shiboken6 --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module qtpy --exclude-module webview --exclude-module PIL --exclude-module tkinter --exclude-module _tkinter --exclude-module cryptography --exclude-module pytest --exclude-module setuptools --exclude-module pip --exclude-module wheel --add-data "gitghost/static${{ matrix.pyinstaller_sep }}gitghost/static" --distpath build_backend --workpath build/pyinstaller_work gitghost/__main__.py

      - name: Install Electron & Build Chromium Desktop Packages
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          node node_modules/electron/install.js || true
          npm run ${{ matrix.npm_script }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unforce-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}

      - name: Publish to GitHub Releases (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          generate_release_notes: true
