<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UnForce — Cyber Forensics Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #03060d;
      color: #e8f3ff;
      font-family: "Cascadia Code", "Consolas", monospace;
      user-select: none;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .logo-wrap {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 32px rgba(0, 255, 157, 0.35);
      margin-bottom: 18px;
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      color: #00ff9d;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    p {
      font-size: 12px;
      color: #5e789c;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="assets/icon.png" alt="UnForce">
  </div>
  <h1>UNFORCE // FORCEPUSH-BREAKER</h1>
  <p>Initializing Cyber-Forensics Engine...</p>
</body>
</html>
